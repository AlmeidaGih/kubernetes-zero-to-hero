apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpleApp
  template:
    metadata:
      labels:
        app: simpleApp
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
          - containerPort: 80